services:
  postgres:
    image: postgres:16
    container_name: surveyapp-postgres
    environment:
      POSTGRES_DB: surveyapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: surveyapp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=surveyapp;Username=postgres;Password=postgres"
      Jwt__Key: ${JWT_KEY}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD}
      SuperAdminSeed__Email: ${SUPERADMIN_SEED_EMAIL:-}
      SuperAdminSeed__Password: ${SUPERADMIN_SEED_PASSWORD:-}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
